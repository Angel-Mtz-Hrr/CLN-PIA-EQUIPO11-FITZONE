name: FitZone CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pruebas-automatizadas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Preparar el entorno con Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar los requerimientos del sistema
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar la suite de pruebas y validar cobertura
        run: |
          python -m pytest tests/ --cov=src --cov-report=term
