<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitZone · Recepción y Socios</title>
  
  <!-- Tipografía moderna Sans-serif: Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=2.2">
</head>

<body>

  <!-- ===================================================== -->
  <!-- FONDO ATMOSFÉRICO: FOTO DE GIMNASIO CON BOKEH + GRADIENTE OSCURO -->
  <!-- ===================================================== -->
  <div class="fondo-atmosfera" aria-hidden="true">
    <div class="fondo-imagen"></div>
    <div class="fondo-degradado"></div>
  </div>

  <!-- ===================================================== -->
  <!-- BARRA SUPERIOR: siempre visible, dice quién está usando -->
  <!-- ===================================================== -->
  <header class="barra">
    <!-- Logotipo profesional con isotipo adaptado -->
    <div class="logo-marca">
      <img src="assets/logo-icon.png" alt="FitZone" class="logo-img">
      <span class="logo-texto">Fit<span class="logo-acento">Zone</span></span>
    </div>

    <!-- Aquí JavaScript escribirá "Recepción · FIT-R001". Empieza vacío. -->
    <span id="usuario-actual" class="usuario"></span>

    <!-- Botón para salir. "hidden" = oculto hasta que alguien entre. -->
    <button id="btn-salir" class="btn btn-logout btn-chico" hidden title="Cerrar sesión">
      <svg class="icono-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Salir</span>
    </button>
  </header>

  <!-- <main> es el contenido principal. Dentro hay varias "vistas" (pantallas). -->
  <!-- Solo una vista se muestra a la vez; JavaScript decide cuál. -->
  <main>

    <!-- ===================================================== -->
    <!-- PANTALLA A: INICIO ("¿Quién eres?")                    -->
    <!-- ===================================================== -->
    <section id="vista-inicio" class="vista">
      <h1>¡Bienvenido a FitZone!</h1>
      <p class="subtitulo">Paso 1: toca quién eres.</p>

      <!-- Dos botones para elegir el rol. -->
      <div class="rejilla-2">
        <button class="tarjeta-boton" data-rol="Recepción" aria-pressed="false" type="button">
          <span class="icono">
            <svg class="icono-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </span>
          <span>Soy RECEPCIÓN</span>
        </button>
        <button class="tarjeta-boton" data-rol="Socio" aria-pressed="false" type="button">
          <span class="icono">
            <svg class="icono-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span>Soy SOCIO</span>
        </button>
      </div>

      <!-- Formulario para escribir el ID. -->
      <form id="form-entrar" class="caja" novalidate>
        <label for="campo-id">Paso 2: escribe tu ID</label>
        <input id="campo-id" type="text" placeholder="Ejemplo: FIT-R001 o FIT-C001"
               autocomplete="off" autocapitalize="characters">
        <small class="pista">Tu ID viene en tu credencial. Empieza con "FIT-".</small>
        <button type="submit" class="btn btn-principal">ENTRAR</button>
      </form>
    </section>

    <!-- ===================================================== -->
    <!-- PANTALLA B: MENÚ PRINCIPAL                             -->
    <!-- ===================================================== -->
    <section id="vista-menu" class="vista" hidden>
      <h1>¿Qué quieres hacer?</h1>
      <div class="rejilla-2">
        <button class="tarjeta-boton" data-ir="clases" type="button">
          <span class="icono">
            <svg class="icono-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span>Ver clases y RESERVAR</span>
        </button>
        <button class="tarjeta-boton" data-ir="socio" type="button">
          <span class="icono">
            <svg class="icono-linea" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <span id="texto-boton-socio">Buscar SOCIO</span>
        </button>
      </div>
      <p id="ayuda-menu" class="pista centrado"></p>
    </section>

    <!-- ===================================================== -->
    <!-- PANTALLA C: CLASES (tarjetas con semáforo)             -->
    <!-- ===================================================== -->
    <section id="vista-clases" class="vista" hidden>
      <button class="btn btn-secundario" data-ir="menu" type="button">Volver al menú</button>
      <h1>Clases de hoy</h1>
      <p class="leyenda">
        <span class="item-leyenda"><span class="punto verde"></span> Hay lugar</span>
        <span class="item-leyenda"><span class="punto ambar"></span> Quedan pocos</span>
        <span class="item-leyenda"><span class="punto rojo"></span> Llena</span>
      </p>
      <div id="lista-clases" class="rejilla-tarjetas">
        <p class="cargando">Cargando clases…</p>
      </div>
    </section>

    <!-- ===================================================== -->
    <!-- PANTALLA D: FICHA DEL SOCIO                            -->
    <!-- ===================================================== -->
    <section id="vista-socio" class="vista" hidden>
      <button class="btn btn-secundario" data-ir="menu" type="button">Volver al menú</button>
      <h1 id="titulo-socio">Buscar socio</h1>

      <!-- Buscador: solo lo ve Recepción (el socio ve directo su ficha). -->
      <form id="form-buscar" class="caja fila" novalidate>
        <label for="campo-buscar" class="solo-lector">ID del socio</label>
        <input id="campo-buscar" type="text" placeholder="ID del socio, ej. FIT-C001"
               autocomplete="off" autocapitalize="characters">
        <button type="submit" class="btn btn-principal">BUSCAR</button>
      </form>

      <!-- Resultado: tarjeta de membresía + historial. Empieza oculto. -->
      <div id="ficha-socio" hidden>
        <div id="tarjeta-membresia" class="membresia"></div>
        <h2>Reservas</h2>
        <div id="lista-reservas"></div>
      </div>
    </section>

  </main>

  <!-- ===================================================== -->
  <!-- AVISOS (mensajes verdes/rojos que aparecen abajo)      -->
  <!-- ===================================================== -->
  <div id="avisos" aria-live="polite"></div>

  <!-- ===================================================== -->
  <!-- VENTANA DE CONFIRMACIÓN ("¿Estás seguro?")             -->
  <!-- ===================================================== -->
  <dialog id="dialogo">
    <form method="dialog" id="form-dialogo">
      <h2 id="dialogo-titulo">¿Confirmas?</h2>
      <p id="dialogo-texto"></p>
      <div id="dialogo-campo" hidden>
        <label for="dialogo-socio">ID del socio</label>
        <input id="dialogo-socio" type="text" placeholder="Ejemplo: FIT-C001"
               autocomplete="off" autocapitalize="characters">
      </div>
      <div class="fila">
        <button value="no" class="btn btn-secundario" type="button" onclick="$('dialogo').close('no')">No, regresar</button>
        <button value="si" id="dialogo-si" class="btn btn-principal" type="button">Sí, confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=2.2"></script>
</body>
</html>
